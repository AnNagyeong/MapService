<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>캠퍼스 관리자</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="graphManager2.css">
</head>
<body>

<div id="map"></div>

<div id="controlBox">

    <!-- ===== NODE ===== -->
    <div class="box-title">🔵 Node</div>

    <div class="section">
        총 Node: <b id="totalNode">0</b> &nbsp;|&nbsp; 표시: <b id="visibleCount">0</b>
    </div>

    <div class="section">
        <div class="section-title">타입 필터</div>
        <div id="nodeTypeFilters"></div>
    </div>

    <div class="section">
        <div class="section-title">Node 검색</div>
        <div id="searchWrapper">
            <input type="text" id="searchInput" placeholder="ID 또는 이름">
            <ul id="searchList"></ul>
        </div>
    </div>

    <!-- ===== EDGE ===== -->
    <div class="box-title">🟠 Edge</div>

    <div class="section">
        총 Edge: <b id="totalEdge">0</b> &nbsp;|&nbsp; 표시: <b id="visibleEdgeCount">0</b>
    </div>

    <div class="section">
        <div class="section-title">표시 제어</div>
        <div class="btn-row">
            <button onclick="toggleEdges(true)">전체 표시</button>
            <button onclick="toggleEdges(false)">전체 숨기기</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">타입 필터</div>
        <div id="edgeTypeFilters"></div>
    </div>

    <div class="section">
        <div class="section-title">선택 Node 연결 Edge</div>
        <div id="selectedNodeInfo">없음</div>
        <div id="nodeIdRow">
            <input type="text" id="nodeIdInput" placeholder="Node ID">
            <button onclick="selectNodeById()">적용</button>
            <button onclick="clearSelection()">해제</button>
        </div>
        <div style="margin-bottom:5px;font-size:11px;color:#888;">※ 마커 클릭해도 됩니다</div>
        <div style="font-size:11px;color:#555;margin-bottom:4px;">연결된 Edge: <b id="connectedEdgeCount">0</b>개</div>
        <ul id="connectedEdgeList"></ul>
    </div>

    <!-- ===== 검증 ===== -->
    <div class="box-title">🔍 검증</div>

    <div class="section">
        <div class="btn-row">
            <button onclick="checkIsolated()">고립 노드 탐지</button>
            <button onclick="checkDuplicates()">중복 엣지 탐지</button>
            <button onclick="clearHighlight()">해제</button>
        </div>
        <div id="validationResult"></div>
    </div>

    <!-- ===== 경로 테스트 ===== -->
    <div class="box-title">🗺️ 경로 테스트</div>

    <div class="section">
        <div class="section-title">선택 방식</div>
        <div class="path-tab-row">
            <div class="path-tab active" id="tabBuilding" onclick="switchPathTab('building')">건물 선택</div>
            <div class="path-tab"        id="tabNode"     onclick="switchPathTab('node')">노드 직접 선택</div>
        </div>

        <!-- 건물 선택 모드 -->
        <div id="modeBuilding">
            <div class="path-row">
                <label>출발</label>
                <select id="pathFromBuilding"></select>
            </div>
            <div class="path-row">
                <label>도착</label>
                <select id="pathToBuilding"></select>
            </div>
        </div>

        <!-- 노드 직접 선택 모드 -->
        <div id="modeNode" style="display:none;">
            <div class="path-row">
                <label>출발</label>
                <div class="node-search-wrap">
                    <input type="text" id="pathFromNodeInput" placeholder="ID 또는 이름" autocomplete="off">
                    <ul class="node-autocomplete" id="pathFromList"></ul>
                </div>
            </div>
            <div class="path-row">
                <label>도착</label>
                <div class="node-search-wrap">
                    <input type="text" id="pathToNodeInput" placeholder="ID 또는 이름" autocomplete="off">
                    <ul class="node-autocomplete" id="pathToList"></ul>
                </div>
            </div>
            <div style="font-size:11px;color:#888;margin-bottom:4px;">
                출발: <b id="pathFromNodeId">미선택</b> &nbsp; 도착: <b id="pathToNodeId">미선택</b>
            </div>
        </div>

        <div style="margin: 6px 0;">
            <label style="font-size:12px;cursor:pointer;">
                <input type="checkbox" id="wheelchairMode"> 휠체어 모드 (계단 제외)
            </label>
        </div>
        <div class="btn-row">
            <button onclick="runPathTest()">경로 찾기</button>
            <button onclick="clearPathTest()">초기화</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">경로 중 노드 표시</div>
        <div class="display-radio">
            <label><input type="radio" name="pathDisplay" value="all"    checked onchange="onPathDisplayChange()"> 모두</label>
            <label><input type="radio" name="pathDisplay" value="path"          onchange="onPathDisplayChange()"> 경로만</label>
            <label><input type="radio" name="pathDisplay" value="filter"        onchange="onPathDisplayChange()"> 필터</label>
        </div>
    </div>

    <div class="section">
        <div id="pathResult">경로를 선택하세요.</div>
        <ul id="pathNodeList"></ul>
    </div>

</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=API키"></script>
<script src="graphManager2.js"></script>
</body>
</html>
